[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-agents"
version = "0.1.0"
description = "Post-training LLM agents (SFT / OPD / RLFT) on multi-turn and SWE benchmarks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.optional-dependencies]
train = ["torch", "transformers", "trl", "peft", "datasets", "vllm"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
